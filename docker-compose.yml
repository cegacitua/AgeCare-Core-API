version: '3.8'

services:
  api:
    build: .
    container_name: agecare-core-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://agecare_user:agecare_password@db:5432/agecare_db
      - SECRET_KEY=super-secret-key-change-in-production-agecare-2026
      - ALLOXENTRIC_API_KEY=alloxentric-mock-key-2026
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16-alpine
    container_name: agecare-postgres-db
    environment:
      POSTGRES_USER: agecare_user
      POSTGRES_PASSWORD: agecare_password
      POSTGRES_DB: agecare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
